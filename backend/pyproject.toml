[project]
name = "finally-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
demo = [
    "prompt-toolkit>=3.0.53",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
default-groups = ["dev", "demo"]
