# End-to-end stack: the FinAlly app in mock-LLM mode plus a Playwright runner.
# Run from the repository root: docker compose -f test/docker-compose.test.yml up --build --exit-code-from playwright
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      LLM_MOCK: "true"
      DHAN_ACESS_TOKEN: ""
      DHAN_ACCESS_TOKEN: ""
      MARKET_SEED: "42"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 2s
      timeout: 5s
      retries: 30

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /app/test
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
    network_mode: "service:app"
    environment:
      BASE_URL: "http://localhost:8000"
      CI: "1"
    volumes:
      - ./:/app/test
    depends_on:
      app:
        condition: service_healthy
